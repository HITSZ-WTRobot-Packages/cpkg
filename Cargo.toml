[package]
name = "cpkg"
version = "0.5.1"
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/HITSZ-WTRobot-Packages/cpkg"

[dependencies]
clap = { version = "4", features = ["derive"] }
toml = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
console = "0.16"
semver = "1"
self_update = { version = "1.3", default-features = false, features = ["ureq", "rustls", "native-certs", "github", "progress-bar", "archive-tar", "compression-tar-gz", "archive-zip", "compression-zip-deflate", "checksums"] }

# Modern utilities
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
glob = "0.3"
